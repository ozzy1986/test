# HTTPS-vhost. Сертификат выпускает certbot (certonly), пути стандартные.
# Сайт — сервис на 127.0.0.1:8120 (deploy/test.service) плюс статичная страница из current/public.
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName test.ozzy1986.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/test.ozzy1986.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/test.ozzy1986.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Пустой DocumentRoot: с диска отдаётся только то, что явно подключено через Alias ниже.
    DocumentRoot /var/www/test.ozzy1986.com/acme

    # Статичная SEO-страница и её стили — с диска, мимо приложения.
    Alias /screen-enclosure-cost-florida /var/www/test.ozzy1986.com/current/public/screen-enclosure-cost-florida
    Alias /assets /var/www/test.ozzy1986.com/current/public/assets
    <Directory /var/www/test.ozzy1986.com/current/public>
        Require all granted
        Options -Indexes
        DirectoryIndex index.html
    </Directory>

    ProxyPreserveHost On
    ProxyPass        /screen-enclosure-cost-florida !
    ProxyPass        /assets !
    ProxyPass        / http://127.0.0.1:8120/ retry=0 timeout=30
    ProxyPassReverse / http://127.0.0.1:8120/
    RequestHeader set X-Forwarded-Proto "https"

    # Тело запроса приложение не читает ни на одном маршруте (LimitRequestBody на проксируемые
    # запросы в этой сборке Apache не действует — проверено). Ограничиваем заголовки и строку запроса.
    LimitRequestFields 50
    LimitRequestLine 4094

    # nosniff, CORS и Cache-Control ставит само приложение.
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set Content-Security-Policy "default-src 'none'; frame-ancestors 'none'"
    # Странице нужны свои стили и data:-иконка; скриптов на ней нет.
    <LocationMatch "^/(screen-enclosure-cost-florida|assets)(/|$)">
        Header always set Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header set Cache-Control "public, max-age=300"
        # Тестовая копия статьи — в поиск не пускаем, чтобы не создать дубль будущей публикации.
        Header always set X-Robots-Tag "noindex, nofollow"
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/test.ozzy1986.com_error.log
    CustomLog ${APACHE_LOG_DIR}/test.ozzy1986.com_access.log combined
</VirtualHost>
</IfModule>
