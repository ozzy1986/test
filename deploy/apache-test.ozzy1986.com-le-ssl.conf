# HTTPS-vhost. Сертификат выпускает certbot (certonly), пути стандартные.
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName test.ozzy1986.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/test.ozzy1986.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/test.ozzy1986.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Статика / собранный фронт — из текущего релиза (папка public/).
    DocumentRoot /var/www/test.ozzy1986.com/current/public
    <Directory /var/www/test.ozzy1986.com/current/public>
        AllowOverride None
        Require all granted
        Options -Indexes +FollowSymLinks
        # SPA / фронт-контроллер: любой не-файл отдаём index.html (для PHP — /index.php).
        FallbackResource /index.html
    </Directory>

    # PHP через php8.5-fpm — раскомментировать, если стек PHP (и FallbackResource → /index.php).
    #<FilesMatch "\.php$">
    #    SetHandler "proxy:unix:/run/php/php8.5-fpm.sock|fcgi://localhost"
    #</FilesMatch>

    # Бэкенд (systemd test.service или docker) на 127.0.0.1:8120.
    ProxyPreserveHost On
    ProxyPass        /api http://127.0.0.1:8120/api retry=0 timeout=60
    ProxyPassReverse /api http://127.0.0.1:8120/api
    RequestHeader set X-Forwarded-Proto "https"

    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000"

    ErrorLog ${APACHE_LOG_DIR}/test.ozzy1986.com_error.log
    CustomLog ${APACHE_LOG_DIR}/test.ozzy1986.com_access.log combined
</VirtualHost>
</IfModule>
