# HTTP: только ACME-челлендж certbot и редирект на HTTPS. Ставит deploy/setup-server.sh.
<VirtualHost *:80>
    ServerName test.ozzy1986.com
    DocumentRoot /var/www/test.ozzy1986.com/acme

    <Directory /var/www/test.ozzy1986.com/acme>
        Require all granted
        Options -Indexes
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://test.ozzy1986.com%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog ${APACHE_LOG_DIR}/test.ozzy1986.com_error.log
    CustomLog ${APACHE_LOG_DIR}/test.ozzy1986.com_access.log combined
</VirtualHost>
